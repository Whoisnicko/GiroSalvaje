<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardian Lab 7.73</title><style>body{margin:0;background:#17141f;color:#efcf99;font:16px Georgia,serif}main{max-width:900px;margin:auto;padding:16px}a{color:#c5e4ff}section{display:grid;grid-template-columns:minmax(65px,1fr) repeat(3,minmax(0,1.7fr));gap:4px;align-items:center}.cell{background:#262532;border:1px solid #806344;padding:4px;min-width:0;text-align:center}canvas{width:100%;max-width:180px;height:auto;image-rendering:pixelated}small{display:block;color:#ddd}h1{font-size:clamp(20px,4vw,32px)}</style></head><body><main><h1>Guardian Art Lab · 7.73</h1><p>Assets reales de Tier I (V72) y nuevos Tier II/III (V73). La galería conserva la proporción; el juego aplica escala y anclaje dinámicos. Werewolf II/III solo son diseños, no evoluciones jugables.</p><p><a href="index.html">Jugar preview</a> · <a href="index.html?guardians=original">Comparar arte legado</a></p><p id="status">Cargando…</p><section id="grid"></section></main><script>const names=['Zombie','Wraith','Dragon','Necromancer','Banshee','Werewolf','Skeleton'];const grid=document.getElementById('grid');grid.innerHTML=['Guardian','★','★★','★★★'].map(n=>'<div class="cell">'+n+'</div>').join('')+names.map((name,row)=>'<div class="cell">'+name+'</div>'+[1,2,3].map(t=>'<div class="cell"><canvas width="160" height="128" data-row="'+row+'" data-tier="'+t+'"></canvas>'+(row===5&&t>1?'<small>Solo diseño</small>':'')+'</div>').join('')).join('');function load(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})}Promise.all([load('assets/guardians-v72.webp?v=22a7p72'),load('assets/guardians-v73.webp?v=22a7p73')]).then(([old,art])=>{if(old.width!==432||old.height!==672||art.width!==320||art.height!==896)throw Error('atlas inválido');document.querySelectorAll('canvas').forEach(c=>{const t=Number(c.dataset.tier),row=Number(c.dataset.row),g=c.getContext('2d');g.imageSmoothingEnabled=false;if(t===1)g.drawImage(old,0,row*96,144,96,8,16,144,96);else g.drawImage(art,(t-2)*160,row*128,160,128,0,0,160,128)});document.getElementById('status').textContent='21 diseños reales cargados.'}).catch(()=>document.getElementById('status').textContent='No se pudo cargar el arte.');</script></body></html>
